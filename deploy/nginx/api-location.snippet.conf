# Inside every location /api/ block for fitclubapp.shop.
# The API sets the session cookie with Path=/. These lines undo a proxy
# that rewrites that path to /api, and they tell the CDN not to store
# private JSON such as "who is signed in".

proxy_cookie_path /api/ /;
proxy_cookie_path /api /;
proxy_hide_header Cache-Control;
add_header Cache-Control "private, no-store" always;
add_header Pragma "no-cache" always;
